<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Hill briefing superseded</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0b1220; color: #e8eef9; padding: 24px;
    }
    .card {
      width: min(100%, 420px); padding: 28px 24px; border-radius: 14px;
      background: #121a2b; border: 1px solid #243047; text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 10px; }
    p { color: #9fb0cc; font-size: 15px; line-height: 1.45; margin: 0 0 14px; }
    a.btn {
      display: inline-block; margin-top: 6px; padding: 12px 16px; border-radius: 10px;
      background: #3b82f6; color: #fff; font-weight: 700; text-decoration: none;
    }
    .url { margin-top: 14px; font-size: 12px; color: #7f92b0; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>This site has been superseded</h1>
    <p>The Sep 23 Hill briefing deck moved to a fresh URL so phones pick up the latest version (passphrase gate, schedule, contacts).</p>
    <a class="btn" href="https://jvanderson.github.io/hill-briefing-sep23-final/">Open the current briefing</a>
    <p class="url">https://jvanderson.github.io/hill-briefing-sep23-final/</p>
    <p style="margin-top:18px;font-size:12px;color:#7f92b0">Passphrase unchanged: beacon-hill</p>
  </div>
</body>
</html>
