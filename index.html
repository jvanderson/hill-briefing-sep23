<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1419" />
  <title>Beacon Hill Briefing — Wed Sep 23, 2026</title>
  <style>
    :root {
      --bg: #0f1419;
      --bg-elev: #171d25;
      --bg-card: #1c2430;
      --bg-hover: #243041;
      --border: #2a3544;
      --border-soft: #232d3a;
      --text: #e8edf4;
      --text-muted: #9aa8b8;
      --text-dim: #6b7a8c;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --accent-strong: #60a5fa;
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.12);
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.12);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --nc: #60a5fa;
      --nc-soft: rgba(59, 130, 246, 0.15);
      --mi: #a78bfa;
      --mi-soft: rgba(167, 139, 250, 0.15);
      --pill: #1e3a5f;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0,0,0,0.35);
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
      --chrome-h: 52px;
      --dots-h: 28px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    a { color: var(--accent-strong); text-decoration: none; }

    /* —— Top chrome —— */
    .chrome {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: calc(var(--chrome-h) + var(--safe-t));
      padding-top: var(--safe-t);
      background: rgba(15, 20, 25, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding-left: 14px;
      padding-right: 14px;
      gap: 10px;
    }
    .wordmark {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 14px; letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .wordmark-mark {
      width: 22px; height: 22px; border-radius: 5px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: grid; place-items: center;
      font-size: 11px; font-weight: 800; color: #fff;
    }
    .chrome-meta {
      flex: 1; min-width: 0;
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chrome-meta strong { color: var(--warning); font-weight: 600; }
    .chrome-pill {
      flex-shrink: 0;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 9px; border-radius: 999px;
      background: var(--pill); color: var(--accent-strong);
      border: 1px solid rgba(59,130,246,0.35);
    }

    /* —— Horizontal deck —— */
    .deck {
      position: fixed;
      top: calc(var(--chrome-h) + var(--safe-t));
      left: 0; right: 0;
      bottom: calc(var(--dots-h) + var(--safe-b) + 8px);
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .deck::-webkit-scrollbar { display: none; }

    .panel {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px 28px;
    }

    /* —— Dots —— */
    .dots {
      position: fixed;
      left: 0; right: 0;
      bottom: var(--safe-b);
      height: calc(var(--dots-h) + 8px);
      display: flex; align-items: center; justify-content: center;
      gap: 7px;
      background: linear-gradient(transparent, rgba(15,20,25,0.95));
      padding-bottom: 8px;
      z-index: 90;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border);
      transition: all 0.2s;
    }
    .dot.active {
      background: var(--accent-strong);
      width: 18px; border-radius: 4px;
    }
    .dot.home { background: var(--text-dim); }
    .dot.home.active { background: var(--warning); }

    /* —— Shared cards —— */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .card h3 {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--accent-strong);
      margin-bottom: 8px;
    }
    .card p, .card li { font-size: 15px; color: var(--text); }
    .card ul { padding-left: 1.1em; }
    .card li { margin-bottom: 6px; }
    .card li:last-child { margin-bottom: 0; }
    .muted { color: var(--text-muted); }
    .dim { color: var(--text-dim); }
    .mono { font-family: var(--mono); font-size: 13px; }

    /* —— Home —— */
    .home-hero {
      margin-bottom: 14px;
    }
    .home-hero h1 {
      font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em;
      line-height: 1.25; margin-bottom: 6px;
    }
    .home-hero .lede {
      font-size: 14px; color: var(--text-muted); margin-bottom: 12px;
    }
    .stat-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 8px; text-align: center;
    }
    .stat .v { font-size: 1.35rem; font-weight: 700; color: var(--accent-strong); letter-spacing: -0.02em; }
    .stat .l { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .day-list { display: flex; flex-direction: column; gap: 8px; }
    .day-item {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 10px; align-items: center;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      text-align: left; width: 100%;
      transition: background 0.15s, border-color 0.15s;
    }
    .day-item:active { background: var(--bg-hover); }
    .day-item .t {
      font-weight: 700; font-size: 14px; color: var(--accent-strong);
      font-variant-numeric: tabular-nums;
    }
    .day-item .who { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
    .day-item .where { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .day-item .badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; padding: 4px 8px; border-radius: 999px;
    }
    .badge.nc { background: var(--nc-soft); color: var(--nc); border: 1px solid rgba(59,130,246,0.3); }
    .badge.mi { background: var(--mi-soft); color: var(--mi); border: 1px solid rgba(167,139,250,0.3); }
    .badge.breakfast { background: var(--warning-soft); color: var(--warning); border: 1px solid rgba(251,191,36,0.3); }
    .day-item-event { cursor: default; }
    .day-item-event .who { color: var(--warning); }
    .day-item-event .day-note { color: var(--warning); }

    .hint {
      margin-top: 14px; font-size: 12.5px; color: var(--text-dim);
      text-align: center; padding: 0 8px;
    }

    /* —— Office header —— */
    .office-head {
      margin-bottom: 10px;
    }
    .office-head .time-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .office-head .time {
      font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .office-head .state-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; padding: 4px 9px; border-radius: 999px;
    }
    .office-head h2 {
      font-size: 1.2rem; font-weight: 700; letter-spacing: -0.015em;
      line-height: 1.25; margin-bottom: 4px;
    }
    .office-head .sub {
      font-size: 13.5px; color: var(--text-muted);
    }
    .office-head .loc {
      font-size: 13px; color: var(--text-dim); margin-top: 4px;
      font-family: var(--mono);
    }

    .lock-banner {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 11px 13px; border-radius: var(--radius-sm);
      margin-bottom: 12px; font-size: 13.5px; font-weight: 600;
      line-height: 1.35;
    }
    .lock-banner.nc {
      background: var(--nc-soft); border: 1px solid rgba(59,130,246,0.35);
      color: var(--accent-strong);
    }
    .lock-banner.mi {
      background: var(--mi-soft); border: 1px solid rgba(167,139,250,0.35);
      color: #c4b5fd;
    }
    .lock-banner .icon { flex-shrink: 0; font-size: 15px; }

    /* —— Section tabs —— */
    .sect-tabs {
      display: flex; gap: 4px; overflow-x: auto;
      scrollbar-width: none; margin-bottom: 12px;
      position: sticky; top: 0; z-index: 10;
      background: rgba(15,20,25,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 6px 0 8px;
      margin-left: -2px; margin-right: -2px;
      padding-left: 2px; padding-right: 2px;
    }
    .sect-tabs::-webkit-scrollbar { display: none; }
    .sect-tab {
      flex-shrink: 0;
      font-size: 12px; font-weight: 600;
      padding: 7px 12px; border-radius: 999px;
      color: var(--text-dim);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .sect-tab.active {
      color: #fff; background: var(--accent);
      border-color: var(--accent);
    }

    .sect { display: none; }
    .sect.active { display: block; }

    /* —— Who table —— */
    .kv { display: grid; gap: 8px; }
    .kv-row {
      display: grid; grid-template-columns: 88px 1fr;
      gap: 8px; font-size: 14.5px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border-soft);
    }
    .kv-row:last-child { border-bottom: none; padding-bottom: 0; }
    .kv-row .k { color: var(--text-dim); font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em; padding-top: 2px; }
    .kv-row .v { color: var(--text); }

    .member-snap {
      margin-top: 10px; padding: 12px 14px;
      background: var(--bg-elev); border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
      font-size: 14px; color: var(--text-muted);
    }
    .member-snap strong { color: var(--text); }

    /* —— Why SSP A —— */
    .sspa { display: grid; gap: 8px; }
    .sspa-item {
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px;
    }
    .sspa-item .label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--accent-strong); margin-bottom: 4px;
    }
    .sspa-item p { font-size: 14.5px; color: var(--text); }

    /* —— Open quote —— */
    .open-quote {
      position: relative;
      padding: 16px 16px 16px 20px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14.5px; color: var(--text);
      line-height: 1.55;
    }
    .open-quote::before {
      content: '"';
      position: absolute; left: 8px; top: 4px;
      font-size: 36px; line-height: 1; color: var(--accent);
      opacity: 0.35; font-family: Georgia, serif;
    }
    .open-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 8px;
    }

    /* —— Asks —— */
    .ask {
      display: grid; grid-template-columns: 28px 1fr; gap: 10px;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 13px 14px;
      margin-bottom: 8px;
    }
    .ask .n {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent-strong);
      display: grid; place-items: center;
      font-weight: 800; font-size: 13px;
    }
    .ask .title { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: var(--accent-strong); }
    .ask .body { font-size: 14px; color: var(--text); }

    .artifact {
      margin-top: 10px; padding: 12px 14px;
      background: var(--success-soft); border: 1px solid rgba(52,211,153,0.3);
      border-radius: var(--radius-sm); font-size: 13.5px; color: var(--text);
    }
    .artifact strong { color: var(--success); }

    /* —— Glance —— */
    .glance {
      display: flex; flex-direction: column; gap: 7px;
    }
    .glance-item {
      display: flex; gap: 10px; align-items: flex-start;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 11px 13px;
      font-size: 14.5px;
    }
    .glance-item .bullet {
      flex-shrink: 0; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); margin-top: 7px;
    }

    /* —— Watch-outs —— */
    .watch {
      display: flex; gap: 10px; align-items: flex-start;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-left: 3px solid var(--warning);
      border-radius: var(--radius-sm); padding: 11px 13px;
      margin-bottom: 8px; font-size: 14px;
    }
    .watch .tag {
      flex-shrink: 0; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--warning); padding-top: 2px; min-width: 18px;
    }

    .hard-no {
      margin-top: 8px; padding: 11px 13px;
      background: var(--danger-soft); border: 1px solid rgba(248,113,113,0.3);
      border-radius: var(--radius-sm); font-size: 13px; color: var(--danger);
      font-weight: 600;
    }

    .logistics {
      margin-top: 8px; font-size: 13px; color: var(--text-muted);
    }
    .logistics span { color: var(--text-dim); }

    .swipe-hint {
      text-align: center; font-size: 11.5px; color: var(--text-dim);
      margin-top: 16px; padding-bottom: 4px;
    }


    /* —— Home map —— */
    .map-card { margin-bottom: 12px; }
    .map-card .map-note {
      font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4;
    }
    .map-wrap {
      display: block; width: 100%;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      cursor: zoom-in;
      -webkit-tap-highlight-color: transparent;
    }
    .map-wrap img {
      display: block; width: 100%; height: auto;
      max-height: 220px; object-fit: cover; object-position: center;
    }
    .map-hint {
      font-size: 11px; color: var(--text-dim); margin-top: 6px; text-align: center;
    }
    .watch-subtle {
      margin-top: 10px; padding: 10px 12px;
      background: var(--warning-soft); border: 1px solid rgba(251,191,36,0.25);
      border-radius: var(--radius-sm); font-size: 12.5px; color: var(--warning);
      line-height: 1.4;
    }
    .dayof-line {
      font-size: 14px; color: var(--text); line-height: 1.45;
    }
    .dayof-line a { color: var(--accent-strong); font-weight: 600; }
    .contact-one {
      margin-top: 10px; padding: 10px 12px;
      background: var(--bg-elev); border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 13.5px; color: var(--text);
      font-family: var(--mono);
    }
    .contact-one a { color: var(--accent-strong); }

    /* —— Lightbox —— */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.92);
      align-items: center; justify-content: center;
      padding: env(safe-area-inset-top, 12px) 12px calc(env(safe-area-inset-bottom, 12px) + 12px);
      overscroll-behavior: contain;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      width: 100%; height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
      border-radius: 8px;
    }
    .lightbox-inner img {
      display: block; width: 100%; height: auto; min-width: 100%;
    }
    .lightbox-close {
      position: absolute; top: calc(env(safe-area-inset-top, 8px) + 8px); right: 14px;
      z-index: 201;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.15); color: #fff;
      font-size: 22px; line-height: 1; display: grid; place-items: center;
    }

    /* —— Passphrase gate —— */
    .gate {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    .gate[hidden] { display: none !important; }
    .gate-card {
      width: min(100%, 360px);
      padding: 28px 24px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .gate-mark {
      width: 34px; height: 34px; margin: 0 auto 16px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: grid; place-items: center;
      color: #fff; font-size: 16px; font-weight: 800;
    }
    .gate-card h1 {
      font-size: 1.35rem; line-height: 1.25; margin-bottom: 7px;
    }
    .gate-card p { color: var(--text-muted); font-size: 14px; }
    .gate-form {
      display: flex; gap: 8px; margin-top: 18px;
    }
    .gate-input {
      min-width: 0; flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elev); color: var(--text);
      font: inherit; outline: none;
    }
    .gate-input:focus { border-color: var(--accent-strong); }
    .gate-submit {
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--accent); color: #fff;
      font-weight: 700;
    }
    .gate-submit:active { background: #2563eb; }
    .gate-status {
      min-height: 21px; margin-top: 10px;
      color: var(--danger) !important;
      font-size: 13px !important;
    }
    .gate-footer {
      margin-top: 18px; color: var(--text-dim) !important;
      font-size: 11px !important;
    }

    @media (min-width: 640px) {
      .panel { padding: 18px 24px 32px; max-width: 560px; margin: 0 auto; }
      .deck { justify-content: flex-start; }
      body { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="gate" id="briefingGate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="gate-card">
      <div class="gate-mark" aria-hidden="true">B</div>
      <h1 id="gateTitle">Beacon Hill briefing</h1>
      <p>Enter the passphrase to continue.</p>
      <form class="gate-form" id="gateForm">
        <input class="gate-input" id="gatePassphrase" type="password" autocomplete="off" aria-label="Passphrase" required />
        <button class="gate-submit" type="submit">Enter</button>
      </form>
      <p class="gate-status" id="gateStatus" role="status" aria-live="polite"></p>
      <p class="gate-footer">Shared with Beacon / W&amp;W — not for distribution.</p>
    </div>
  </div>
  <header class="chrome">
    <div class="wordmark">
      <div class="wordmark-mark">B</div>
      <span>Beacon</span>
    </div>
    <div class="chrome-meta" id="chromeMeta"><strong>PRIVATE</strong> · Wed Sep 23, 2026 · Hill day</div>
    <div class="chrome-pill">Brief</div>
  </header>

  <div class="deck" id="deck" role="region" aria-label="Hill briefing deck"></div>
  <nav class="dots" id="dots" aria-label="Office navigation"></nav>
  <div class="lightbox" id="mapLightbox" role="dialog" aria-modal="true" aria-label="Capitol Hill map">
    <button type="button" class="lightbox-close" id="mapClose" aria-label="Close map">×</button>
    <div class="lightbox-inner">
      <img id="mapLightboxImg" src="capitol-hill-map.jpg" alt="Capitol Hill map full size" />
    </div>
  </div>

  <script>
  /* Simple client-side gate for this private, non-security briefing. */
  const GATE_SESSION_KEY = "beaconHillBriefingUnlocked";
  const GATE_PASS_HASH = 0x53cf104f; // FNV-1a hash of the normalized passphrase

  function gateHash(value) {
    let hash = 0x811c9dc5;
    for (let i = 0; i < value.length; i++) {
      hash ^= value.charCodeAt(i);
      hash = Math.imul(hash, 0x01000193);
    }
    return hash >>> 0;
  }

  /* —— Render —— */
  const SECTIONS = [

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderOffice(o, idx) {

    return `

        </div>
        <div class="lock-banner ${lockClass}">
          <span class="icon">◎</span>

        </div>
        <div class="sect-tabs" role="tablist">${tabs}</div>

      </section>
    `;
  }

  function build() {
    const deck = document.getElementById("deck");
    const dots = document.getElementById("dots");
    deck.innerHTML = renderHome() + OFFICES.map((o, i) => renderOffice(o, i)).join("");

    const n = OFFICES.length + 1;
    dots.innerHTML = Array.from({ length: n }, (_, i) =>
      `<button type="button" class="dot${i === 0 ? " active home" : ""}" data-goto="${i}" aria-label="${i === 0 ? "Day overview" : OFFICES[i - 1].memberShort}"></button>`
    ).join("");

    // Day-item / dot navigation
    document.body.addEventListener("click", (e) => {
      const goto = e.target.closest("[data-goto]");
      if (goto) {
        const i = +goto.getAttribute("data-goto");
        const panel = deck.querySelector(`[data-panel="${i}"]`);
        if (panel) panel.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
      }
      const tab = e.target.closest(".sect-tab");
      if (tab) {
        const panel = tab.closest(".panel");
        const sid = tab.getAttribute("data-sect");
        panel.querySelectorAll(".sect-tab").forEach(t => t.classList.toggle("active", t === tab));
        panel.querySelectorAll(".sect").forEach(s => s.classList.toggle("active", s.getAttribute("data-sect") === sid));
        // scroll tabs into view a bit
        tab.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
    });

    // Sync dots + chrome on scroll
    const panels = [...deck.querySelectorAll(".panel")];
    const meta = document.getElementById("chromeMeta");
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (!en.isIntersecting || en.intersectionRatio < 0.55) return;
        const i = +en.target.getAttribute("data-panel");
        dots.querySelectorAll(".dot").forEach((d, di) => {
          d.classList.toggle("active", di === i);
        });
        if (i === 0) {
          meta.innerHTML = `<strong>PRIVATE</strong> · ${esc(DAY.dateLabel)} · Hill day`;
        } else {
          const o = OFFICES[i - 1];
          meta.innerHTML = `<strong>${esc(o.time)}</strong> · ${esc(o.staff)} / ${esc(o.memberShort)} · ${esc(o.building)}`;
        }
      });
    }, { root: deck, threshold: 0.55 });
    panels.forEach(p => io.observe(p));

    // Map lightbox (home)
    const lb = document.getElementById("mapLightbox");
    const openMap = () => { if (lb) lb.classList.add("open"); };
    const closeMap = () => { if (lb) lb.classList.remove("open"); };
    document.body.addEventListener("click", (e) => {
      if (e.target.closest("#mapOpen")) { e.preventDefault(); openMap(); }
      if (e.target.closest("#mapClose") || (e.target === lb)) closeMap();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMap(); });
  }

  build();
